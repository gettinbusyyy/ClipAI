<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipAI — Log in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0f14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      background: #161a24;
      border: 1px solid #252a38;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 400px;
      width: 100%;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      text-decoration: none;
      color: inherit;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .logo h1 { font-size: 1.3rem; font-weight: 700; }
    .logo span { color: #8b5cf6; }
    h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
    .sub { font-size: 0.875rem; color: #64748b; margin-bottom: 28px; }
    .sub a { color: #6366f1; text-decoration: none; }
    .sub a:hover { text-decoration: underline; }
    label { display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px; }
    input[type=email], input[type=password] {
      width: 100%;
      background: #0d0f14;
      border: 1px solid #252a38;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.93rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 18px;
    }
    input:focus { border-color: #6366f1; }
    .error {
      background: #2d1515;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      color: #fca5a5;
      font-size: 0.83rem;
      padding: 10px 14px;
      margin-bottom: 18px;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 13px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
  </style>
</head>
<body>
<div class="card">
  <a href="/" class="logo">
    <div class="logo-icon">✂</div>
    <h1>Clip<span>AI</span></h1>
  </a>
  <h2>Welcome back</h2>
  <p class="sub">No account? <a href="/signup">Sign up free</a></p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="email"
           value="{{ email or '' }}" placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password"
           placeholder="••••••••">

    <button type="submit" class="btn">Log in</button>
  </form>
</div>
</body>
</html>
